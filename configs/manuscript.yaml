# Manuscript-supported optimizer/schedule; explicit architecture choices in docs.
seed: 42
threads: 2
model:
  name: swin
  embed_dim: 96
  depths: [2, 2, 6, 2]
  heads: [3, 6, 12, 24]
  window: 7
  spatial_attention: true
data:
  size: 256
  mode: binary
  denoise: gaussian
  morphology: 0
training:
  epochs: 50
  batch_size: 4
  lr: 0.0002
  loss: hybrid
